name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET: test-secret-for-ci
      DATABASE_URL: file:./test.db
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - id: lint
        name: Lint
        run: npm run lint

      - id: unit-test
        name: Unit tests
        run: npm run test -- --runInBand

      - id: build
        name: Build
        run: npm run build

      - name: Reset E2E database
        run: rm -f prisma/test.db

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - id: e2e
        name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: CI障害をGitHub Issueに起票する
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          if   [ "${{ steps.lint.outcome }}"      = "failure" ]; then STEP="Lint"
          elif [ "${{ steps.unit-test.outcome }}" = "failure" ]; then STEP="Unit Test"
          elif [ "${{ steps.build.outcome }}"     = "failure" ]; then STEP="Build"
          elif [ "${{ steps.e2e.outcome }}"       = "failure" ]; then STEP="E2E Test"
          else STEP="Unknown"
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="[CI Failure] Backend ${STEP}: ${{ github.ref_name }} @ ${SHORT_SHA}"

          gh label create "ci-failure" --color "#7c3aed" --description "CI pipeline 失敗" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "in:title [CI Failure] Backend" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf "## CI 障害レポート\n\n**ジョブ**: Backend\n**失敗ステップ**: %s\n**ブランチ**: \`%s\`\n**コミット**: \`%s\`\n**実行ログ**: %s\n\n*このIssueはGitHub Actionsにより自動起票されました*" \
              "$STEP" \
              "${{ github.ref_name }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" --label "ci-failure"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - id: lint
        name: Lint
        run: npm run lint

      - id: test
        name: Test
        run: npm test -- --watchAll=false

      - id: build
        name: Build
        run: npm run build

      - name: CI障害をGitHub Issueに起票する
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          if   [ "${{ steps.lint.outcome }}"  = "failure" ]; then STEP="Lint"
          elif [ "${{ steps.test.outcome }}"  = "failure" ]; then STEP="Test"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then STEP="Build"
          else STEP="Unknown"
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="[CI Failure] Frontend ${STEP}: ${{ github.ref_name }} @ ${SHORT_SHA}"

          gh label create "ci-failure" --color "#7c3aed" --description "CI pipeline 失敗" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "in:title [CI Failure] Frontend" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf "## CI 障害レポート\n\n**ジョブ**: Frontend\n**失敗ステップ**: %s\n**ブランチ**: \`%s\`\n**コミット**: \`%s\`\n**実行ログ**: %s\n\n*このIssueはGitHub Actionsにより自動起票されました*" \
              "$STEP" \
              "${{ github.ref_name }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" --label "ci-failure"
          fi

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # バックエンドとフロントエンドのビルドが成功してから実行する
    needs: [backend, frontend]

    env:
      JWT_SECRET: test-secret-for-ci
      DATABASE_URL: file:./prisma/e2e-playwright.db
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # --- バックエンドのセットアップ ---
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Reset Playwright E2E database
        working-directory: backend
        run: rm -f prisma/e2e-playwright.db

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      # --- フロントエンドのセットアップ ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_SCHEME: http
          REACT_APP_API_HOST: localhost
          REACT_APP_API_PORT: "8000"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      # --- バックエンドをバックグラウンドで起動 ---
      - name: Start backend server
        working-directory: backend
        run: npm run start:prod &
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: file:./prisma/e2e-playwright.db
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          THROTTLE_LIMIT: "100"
          THROTTLE_TTL: "1000"

      # --- フロントエンドをプロダクションビルドで serve ---
      - name: Install serve
        run: npm install -g serve

      - name: Start frontend server
        working-directory: frontend
        run: serve -s build -l 3000 &

      # --- サーバーが起動するまで待機 ---
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/docs > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done

      # --- Playwright のセットアップとテスト実行 ---
      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - id: playwright
        name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      # --- テスト結果を artifact として保存 ---
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: CI障害をGitHub Issueに起票する
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="[CI Failure] Playwright E2E: ${{ github.ref_name }} @ ${SHORT_SHA}"

          gh label create "ci-failure" --color "#7c3aed" --description "CI pipeline 失敗" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "in:title [CI Failure] Playwright" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf "## CI 障害レポート\n\n**ジョブ**: Playwright E2E\n**ブランチ**: \`%s\`\n**コミット**: \`%s\`\n**実行ログ**: %s\n\n*このIssueはGitHub Actionsにより自動起票されました*" \
              "${{ github.ref_name }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" --label "ci-failure"
          fi
