name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET: test-secret-for-ci
      DATABASE_URL: file:./test.db
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - id: lint
        name: Lint
        run: npm run lint

      - id: unit-test
        name: Unit tests
        run: npm run test -- --runInBand

      - id: build
        name: Build
        run: npm run build

      - name: Reset E2E database
        run: rm -f prisma/test.db

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - id: e2e
        name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: CI障害をGitHub Issueに起票する
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          if   [ "${{ steps.lint.outcome }}"      = "failure" ]; then STEP="Lint"
          elif [ "${{ steps.unit-test.outcome }}" = "failure" ]; then STEP="Unit Test"
          elif [ "${{ steps.build.outcome }}"     = "failure" ]; then STEP="Build"
          elif [ "${{ steps.e2e.outcome }}"       = "failure" ]; then STEP="E2E Test"
          else STEP="Unknown"
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="[CI Failure] Backend ${STEP}: ${{ github.ref_name }} @ ${SHORT_SHA}"

          gh label create "ci-failure" --color "#7c3aed" --description "CI pipeline 失敗" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "in:title [CI Failure] Backend" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf "## CI 障害レポート\n\n**ジョブ**: Backend\n**失敗ステップ**: %s\n**ブランチ**: \`%s\`\n**コミット**: \`%s\`\n**実行ログ**: %s\n\n*このIssueはGitHub Actionsにより自動起票されました*" \
              "$STEP" \
              "${{ github.ref_name }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" --label "ci-failure"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - id: lint
        name: Lint
        run: npm run lint

      - id: test
        name: Test
        run: npm test -- --watchAll=false

      - id: build
        name: Build
        run: npm run build

      - name: CI障害をGitHub Issueに起票する
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          if   [ "${{ steps.lint.outcome }}"  = "failure" ]; then STEP="Lint"
          elif [ "${{ steps.test.outcome }}"  = "failure" ]; then STEP="Test"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then STEP="Build"
          else STEP="Unknown"
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="[CI Failure] Frontend ${STEP}: ${{ github.ref_name }} @ ${SHORT_SHA}"

          gh label create "ci-failure" --color "#7c3aed" --description "CI pipeline 失敗" --force 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "in:title [CI Failure] Frontend" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf "## CI 障害レポート\n\n**ジョブ**: Frontend\n**失敗ステップ**: %s\n**ブランチ**: \`%s\`\n**コミット**: \`%s\`\n**実行ログ**: %s\n\n*このIssueはGitHub Actionsにより自動起票されました*" \
              "$STEP" \
              "${{ github.ref_name }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" --label "ci-failure"
          fi
